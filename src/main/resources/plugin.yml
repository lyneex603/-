name: ClanPlugin
version: 1.3
main: me.clan.ClanPlugin
api-version: '1.20'
description: Система кланов
commands:
  clan:
    description: Управление кланами
    usage: /clan help
    aliases: [clans]
  cc:
    description: Сообщение в клановый чат
    usage: /cc <сообщение>
permissions:
  clan.use:
    description: Доступ к команде /clan
    default: true
  clan.admin:
    description: Перезагрузка настроек (/clan reload)
    default: op
