# Как определяется "сильнейший клан" в /clan top и в меню.
# mode:
#   power   - очки силы по формуле ниже (по умолчанию)
#   kills   - по числу убийств
#   kd      - по соотношению убийств/смертей
#   members - по числу участников
# После изменения выполните /clan reload (нужно право clan.admin, по умолчанию у операторов)
top:
  mode: power
  power:
    kill: 3      # очков за каждое убийство игрока из другого клана
    death: 1     # штраф за каждую смерть от игрока другого клана
    member: 5    # очков за каждого участника
